name: Build

# Compile check for the visionOS client: builds the Rust client core, repacks it as an
# xcframework (same steps as build_and_repack.sh) and builds the app with the visionOS SDK.
# No signing, no device. Uses GitHub's Xcode 27 runner image (visionOS 27 SDK).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Xcode 27 (visionOS 27 SDK)
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i xros || true
          rustc --version

      - name: Rust target and cbindgen
        run: |
          rustup target add aarch64-apple-ios
          brew install cbindgen

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ALVR/target
          key: cargo-${{ runner.os }}-${{ hashFiles('ALVR/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build client core and xcframework
        run: |
          unset SDKROOT
          rm -rf ALVR/build ALVR/alvr/server
          CARGO_TARGET_DIR=ALVR/target cargo build --manifest-path ALVR/Cargo.toml \
            --target=aarch64-apple-ios -p alvr_client_core --profile distribution
          mkdir -p ALVR/build
          (cd ALVR/alvr/client_core && cbindgen --config cbindgen.toml --crate alvr_client_core --output ../../build/alvr_client_core.h)
          sh repack_alvr_client.sh

      # The Metal toolchain is not preinstalled on the runner image.
      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ALVRClient.xcodeproj -scheme ALVRClient -configuration Debug \
            -destination 'generic/platform=visionOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
